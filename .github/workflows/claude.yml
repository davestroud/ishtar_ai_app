name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Trigger workflow when @claude is mentioned in issues, PRs, or comments
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read  # Required for Claude to read CI results on PRs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          poetry install --no-interaction --no-ansi

      - name: Start FastAPI server
        run: |
          poetry run uvicorn app.main:app --host 0.0.0.0 --port 8000 > logs.txt 2>&1 &
          sleep 5
          echo "FastAPI server started on port 8000"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Allow Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          claude_args: |
            --system-prompt "This is a FastAPI + Jinja2 Python web application using Poetry for dependency management. The project dependencies are already installed via Poetry. The FastAPI server is running at localhost:8000. Server logs are being written to logs.txt. If needed, use the mcp__playwright tools to launch a browser and interact with the app."
            --mcp-config '{"mcpServers":{"playwright":{"command":"npx","args":["@playwright/mcp@latest","--allowed-origins","localhost:8000;fonts.googleapis.com;fonts.gstatic.com;cdnjs.cloudflare.com;www.googletagmanager.com;plausible.io"]}}}'
            --allowedTools "Bash(poetry *),Bash(python *),Bash(uvicorn *),mcp__playwright__browser_snapshot,mcp__playwright__browser_click"